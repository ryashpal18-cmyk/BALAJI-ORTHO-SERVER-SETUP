name: Build Server Setup EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Verify provisioning and offline credential separation
        run: |
          node tests/server-setup.cjs
          node tests/cloud-sync.cjs
          node tests/offline-login.cjs
          node tests/clinic-updates.cjs
          node tests/clinic-branding.cjs
      - run: npm run build
      - name: Real app startup and Server Settings smoke test
        run: npx --no-install electron tests/server-setup-electron.cjs
      - name: Build separate Windows installer
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: BalajiOrthoServerSetup-EXE
          path: |
            release/*.exe
            release/server-setup-preview.png
          if-no-files-found: error
