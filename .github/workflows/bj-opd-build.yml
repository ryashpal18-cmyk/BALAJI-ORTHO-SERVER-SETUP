name: Build BJ OPD Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'build/**'
      - 'index.html'
      - 'electron-builder.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/bj-opd-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Package BJ OPD EXE from CURRENT repository
        run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: BJ-OPD-Windows-EXE
          path: release/*.exe
          if-no-files-found: error
