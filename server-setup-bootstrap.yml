name: Build Separate Server Setup EXE
on:
  push:
    paths: ['.github/workflows/bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy pinned original project and apply isolated Server Setup edition
        shell: python
        run: |
          import urllib.request, zipfile, io, os, pathlib, tarfile, base64, shutil
          root=pathlib.Path.cwd()
          source='https://github.com/ryashpal18-cmyk/BALAJI-ORTHO-CARE-EXE/archive/4786325e0b12629065d045df9b0e11877a966ccf.zip'
          raw=urllib.request.urlopen(source).read()
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
            prefix=z.namelist()[0]
            for entry in z.infolist():
              name=entry.filename[len(prefix):]
              if not name or entry.is_dir() or name.startswith('.github/workflows/') or name in ['.env','auth-public-config.json']:
                continue
              target=root/name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(z.read(entry))
          patch=''
          with tarfile.open(fileobj=io.BytesIO(base64.b64decode(patch)),mode='r:gz') as t:
            t.extractall(root,filter='data')
          import json
          lock_path=root/'package-lock.json'
          lock=json.loads(lock_path.read_text())
          lock['name']='balaji-ortho-server-setup'; lock['version']='1.0.0'
          lock['packages']['']['name']='balaji-ortho-server-setup'; lock['packages']['']['version']='1.0.0'
          lock_path.write_text(json.dumps(lock,indent=2)+'\n')
          for f in ['.env','auth-public-config.json']:
            (root/f).unlink(missing_ok=True)
      - name: Save source code in this separate repository only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows'
          if ! git diff --cached --quiet; then
            git commit -m 'Add isolated customer Supabase server setup edition [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Verify provisioning and offline data safeguards
        run: |
          node tests/server-setup.cjs
          node tests/cloud-sync.cjs
          node tests/offline-login.cjs
          node tests/clinic-updates.cjs
      - run: npm run build
      - name: Verify actual Windows app startup and Server Settings
        run: npx --no-install electron tests/server-setup-electron.cjs
      - name: Build and publish separate EXE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always
      - uses: actions/upload-artifact@v4
        with:
          name: BalajiOrthoServerSetup-EXE
          path: |
            release/*.exe
            release/server-setup-preview.png
          if-no-files-found: error
