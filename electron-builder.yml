appId: com.balaji.ortho.serversetup
productName: BJ OPD
copyright: "BJ TECH SOFTWARE DEVELOPER"

directories:
  output: release

asar: false

publish:
  - provider: github
    owner: ryashpal18-cmyk
    repo: BALAJI-ORTHO-SERVER-SETUP
    releaseType: release

files:
  - dist/**
  - main.js
  - pc-messaging.cjs
  - clinic-profile.cjs
  - whatsapp-service.cjs
  - whatsapp-cloud.cjs
  - messaging-log.cjs
  - family-profile.cjs
  - invoice-document.cjs
  - patient-statement.cjs
  - monthly-report.cjs
  - festival-messaging.cjs
  - outreach-service.cjs
  - attachment-cache.cjs
  - preload.js
  - diagnostics.cjs
  - diagnostic-utils.cjs
  - logger.cjs
  - sqlite-store.cjs
  - backup-encryption.cjs
  - sms-outbox.cjs
  - textbee-settings.cjs
  - access-control.cjs
  - offline-login.cjs
  - cloud-sync.cjs
  - server-setup.cjs
  - server-setup/**
  - package.json

win:
  icon: public/bj-opd-icon.png
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "BJ OPD"
  artifactName: "BJ-OPD-Setup-${version}.exe"

protocols:
  - name: BJ OPD Family Profile
    schemes: [balajiserversetup]
